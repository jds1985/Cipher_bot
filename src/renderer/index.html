<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Cipher</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="splash" aria-hidden="true"><img src="assets/splash.png" alt="Cipher" /></div>
    <div id="app">
      <aside id="sidebar">
        <h1 class="brand">Cipher</h1>
        <div class="section-head">
          <span>Cipher bots</span>
          <button id="new-bot" class="small" title="Create a Cipher bot">+ New Cipher bot</button>
        </div>
        <ul id="bot-list" class="list"></ul>
        <div class="section-head" id="chats-head" hidden>
          <span>Chats</span>
          <button id="new-chat" class="small" title="Start a new chat">+ New chat</button>
        </div>
        <ul id="chat-list" class="list"></ul>
      </aside>
      <main id="main">
        <section id="bot-form-view" class="view" hidden>
          <form id="bot-form" class="card">
            <img class="empty-art" src="assets/empty-state.png" alt="" width="200" height="165" />
            <h2>Create a Cipher bot</h2>
            <label>Name
              <input id="bot-name" maxlength="80" required placeholder="e.g. Notes helper" />
            </label>
            <label>Job
              <textarea id="bot-job" rows="5" placeholder="What should this Cipher bot do? e.g. Help me plan my week and keep answers short."></textarea>
            </label>
            <p id="bot-form-error" class="error" hidden></p>
            <div class="row end">
              <button type="button" id="bot-cancel" class="secondary">Cancel</button>
              <button type="submit">Create Cipher bot</button>
            </div>
          </form>
        </section>
        <section id="setup-view" class="view" hidden>
          <div class="card setup-card">
            <h2>Setting up your Cipher bot</h2>
            <p id="setup-text" class="muted"></p>
            <progress id="setup-progress" max="100" hidden></progress>
            <p id="setup-detail" class="muted" hidden></p>
            <div class="row end">
              <button type="button" id="setup-get-engine" hidden>Get the engine</button>
              <button type="button" id="setup-retry" class="secondary" hidden>Try again</button>
            </div>
          </div>
        </section>
        <section id="chat-view" class="view" hidden>
          <header id="chat-header">
            <div class="title-block">
              <strong id="chat-bot-name"></strong>
              <span id="chat-title" class="muted"></span>
            </div>
            <div class="row bot-settings">
              <label class="row" title="Let this Cipher bot read text files in one folder you choose">
                <input type="checkbox" id="chat-tools" /> <span>Read files</span>
              </label>
              <span id="chat-folder-label" class="muted folder"></span>
              <button id="chat-folder-pick" class="secondary small">Choose folder…</button>
            </div>
          </header>
          <div id="messages"></div>
          <form id="composer">
            <textarea id="input" rows="2" placeholder="Message (Enter to send, Shift+Enter for a new line)"></textarea>
            <button type="submit" id="send">Send</button>
            <button type="button" id="stop" class="secondary" hidden>Stop</button>
          </form>
        </section>
      </main>
    </div>
    <script type="module" src="renderer.js"></script>
  </body>
</html>
